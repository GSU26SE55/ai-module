name: solar-ai

services:
  ai-module:
    image: ${AI_IMAGE:?AI_IMAGE must be an immutable registry digest}
    container_name: solar-ai-module
    restart: unless-stopped
    init: true
    env_file:
      - ${AI_SECRETS_FILE:-/opt/solar-ai/secrets/ai.env}
    environment:
      APP_ENV: production
      AI_ENABLE_GRPC: "true"
      AI_VERIFY_MODEL_MANIFEST: "true"
      AI_REQUIRE_LFP: "true"
      AI_PRELOAD_RAG: "true"
      AI_REQUIRE_RAG: "true"
      AI_TORCH_COMPILE: "false"
      AI_DATA_DIR: /data
      AI_KB_ROOT: /data/kb
      AI_KB_DIR: /data/kb/current
      AI_PRESCRIPTION_HISTORY_DIR: /data/prescription-history
      AI_CLASSIFICATION_FEEDBACK_DIR: /data/classification-feedback
      AI_EMBEDDING_MODEL_PATH: /opt/embedding-model
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ANONYMIZED_TELEMETRY: "false"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    # Application ports are deliberately internal-only. Caddy is the single
    # production ingress and multiplexes HTTPS REST + HTTP/2 gRPC on TCP 443.
    expose:
      - "8000"
      - "50051"
    volumes:
      - /opt/solar-ai/data/kb:/data/kb
      - /opt/solar-ai/data/prescription-history:/data/prescription-history
      - /opt/solar-ai/data/classification-feedback:/data/classification-feedback
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 5g
    cpus: 3.25
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: solar-ai-caddy
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      AI_PUBLIC_DOMAIN: ${AI_PUBLIC_DOMAIN:?AI_PUBLIC_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      HOME: /tmp
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/solar-ai/data/caddy/data:/data
      - /opt/solar-ai/data/caddy/config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.15
    stop_grace_period: 20s
    depends_on:
      ai-module:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8081/caddy-health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks:
      default:
        aliases:
          # Lets the AI container exercise the real TLS ingress without a
          # public-network hairpin during the post-deploy smoke test.
          - ${AI_PUBLIC_DOMAIN}

  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    container_name: solar-ai-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
    ports:
      - "${AI_MONITORING_BIND_IP:?AI_MONITORING_BIND_IP must be the WireGuard address}:9100:9100"
    volumes:
      - /:/host:ro,rslave
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.1

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1@sha256:f40e65878e25c2e78ea037f73a449527a0fb994e303dc3e34cb6b187b4b91435
    container_name: solar-ai-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - "${AI_MONITORING_BIND_IP}:8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.25

  alloy:
    image: grafana/alloy:v1.10.2@sha256:bcf27f18c4402869af112fb39e35e1db3804a404686f4caa20bdf77814219223
    container_name: solar-ai-alloy
    restart: unless-stopped
    # Alloy's image owns /var/lib/alloy with UID 473. Keep the persistent
    # storage in the shared ai-runtime group and add the host Docker socket
    # group separately so discovery works without running the process as root.
    user: "473:10001"
    group_add:
      - "${AI_DOCKER_SOCKET_GID:?AI_DOCKER_SOCKET_GID must match the Docker socket group}"
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://10.20.0.1:3100/loki/api/v1/push}
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/solar-ai/data/alloy:/var/lib/alloy/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/12345;
          printf 'GET /-/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          grep -qE '^HTTP/1\.[01] 200' <&3
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    pids_limit: 256
    mem_limit: 384m
    cpus: 0.25

networks:
  default:
    name: solar-ai-internal
    driver: bridge
