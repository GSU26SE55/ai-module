name: CI — AI Module

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        run: pytest tests/ -v --tb=short
